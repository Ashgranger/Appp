name: Build Amazon Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK and accept licenses
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "build-tools;36.1.0" || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare environment and release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          touch .env
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/fevro-release.jks
            echo "KEYSTORE_PATH=/tmp/fevro-release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            GENERATED_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore /tmp/fevro-release.jks \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "$GENERATED_PASS" \
              -keypass "$GENERATED_PASS" \
              -dname "CN=Fevro Browser, OU=Mobile, O=Fevro, C=US"
            echo "KEYSTORE_PATH=/tmp/fevro-release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$GENERATED_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$GENERATED_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Fevro Browser Release APK
        shell: bash
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APK output
        shell: bash
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/fevro-browser-release.apk
          ls -lh release-output/fevro-browser-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fevro-browser-release-apk
          path: release-output/fevro-browser-release.apk
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-output/fevro-browser-release.apk --clobber
          else
            gh release create "$TAG" release-output/fevro-browser-release.apk \
              --title "Fevro Browser Release APK (Amazon Appstore)" \
              --notes "Tap fevro-browser-release.apk below to download directly and upload to Amazon Appstore."
          fi
